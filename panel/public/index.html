<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل مدیریت VLESS</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: #0f0f14;
    color: #eee;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; color: #b18cff; margin-bottom: 20px; }
  .card {
    background: #1a1a22;
    border: 1px solid #2a2a35;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f0f14;
    color: #eee;
    font-family: inherit;
    margin-bottom: 10px;
  }
  button {
    background: #7c4dff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }
  button.secondary { background: #333; }
  button.danger { background: #c0392b; }
  #login-view { max-width: 320px; margin: 80px auto; }
  .user-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .user-name { font-weight: bold; }
  .traffic { font-size: 12px; color: #999; }
  .link-box {
    font-size: 11px;
    background: #0f0f14;
    padding: 8px;
    border-radius: 6px;
    word-break: break-all;
    margin-top: 8px;
    color: #7fd97f;
  }
  .actions { display: flex; gap: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="login-view" class="wrap">
  <h1>ورود به پنل</h1>
  <div class="card">
    <input type="password" id="password" placeholder="رمز عبور ادمین" />
    <button onclick="login()" style="width:100%">ورود</button>
    <div id="login-error" style="color:#e74c3c; margin-top:8px; font-size:13px;"></div>
  </div>
</div>

<div id="main-view" class="wrap hidden">
  <h1>پنل مدیریت VLESS</h1>
  <div class="card">
    <input type="text" id="new-user-name" placeholder="نام کاربر جدید" />
    <button onclick="addUser()">افزودن کاربر</button>
  </div>
  <div id="users-list"></div>
</div>

<script>
async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 401) {
    showLogin();
    throw new Error('unauthorized');
  }
  return res.json();
}

function showLogin() {
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('main-view').classList.add('hidden');
}

function showMain() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('main-view').classList.remove('hidden');
  loadUsers();
}

async function login() {
  const password = document.getElementById('password').value;
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify({ password }) });
    showMain();
  } catch {
    document.getElementById('login-error').textContent = 'رمز اشتباه است';
  }
}

async function addUser() {
  const name = document.getElementById('new-user-name').value;
  if (!name.trim()) return;
  await api('/api/users', { method: 'POST', body: JSON.stringify({ name }) });
  document.getElementById('new-user-name').value = '';
  loadUsers();
}

async function removeUser(id) {
  if (!confirm('حذف شود؟')) return;
  await api('/api/users/' + id, { method: 'DELETE' });
  loadUsers();
}

async function toggleUser(id) {
  await api('/api/users/' + id + '/toggle', { method: 'PATCH' });
  loadUsers();
}

function formatBytes(bytes) {
  if (!bytes) return '0 MB';
  const mb = bytes / 1024 / 1024;
  if (mb > 1024) return (mb / 1024).toFixed(2) + ' GB';
  return mb.toFixed(1) + ' MB';
}

async function loadUsers() {
  const users = await api('/api/users');
  const list = document.getElementById('users-list');
  list.innerHTML = users
    .map(
      (u) => `
    <div class="card">
      <div class="user-row">
        <div>
          <div class="user-name">${u.name} ${u.enabled ? '' : '(غیرفعال)'}</div>
          <div class="traffic">
            ↑ ${formatBytes(u.traffic.uplink)} &nbsp; ↓ ${formatBytes(u.traffic.downlink)}
          </div>
        </div>
        <div class="actions">
          <button class="secondary" onclick="toggleUser(${u.id})">${u.enabled ? 'غیرفعال' : 'فعال'}</button>
          <button class="danger" onclick="removeUser(${u.id})">حذف</button>
        </div>
      </div>
      <div class="link-box">${u.link}</div>
    </div>
  `
    )
    .join('');
}

api('/api/users')
  .then(() => showMain())
  .catch(() => showLogin());
</script>
</body>
</html>
